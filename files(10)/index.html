<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulter un fichier</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --text:#1a1d23; --muted:#6b7280;
  --accent:#2563eb; --accent-text:#ffffff; --border:#e2e4e9; --danger:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c; --surface:#1f2227; --text:#eef0f3; --muted:#9aa1ad;
    --accent:#3b82f6; --accent-text:#0a0a0a; --border:#2d313a; --danger:#f87171;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
.card h2{font-size:1.05rem;margin:0 0 14px;}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px;}
input[type=text],input[type=file]{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:.95rem;
}
input[type=text].code-input{letter-spacing:1px;text-transform:uppercase;}
button{
  margin-top:16px;padding:10px 18px;border:none;border-radius:9px;
  background:var(--accent);color:var(--accent-text);font-weight:600;font-size:.9rem;cursor:pointer;
}
button.secondary{background:transparent;color:var(--danger);border:1px solid var(--border);margin-left:8px;padding:8px 12px;}
.code-box{
  font-size:1.4rem;font-weight:700;letter-spacing:3px;text-align:center;
  padding:14px;border-radius:10px;background:var(--bg);border:1px dashed var(--accent);margin-top:14px;
}
.msg{font-size:.85rem;margin-top:10px;}
.msg.err{color:var(--danger);}
.msg.ok{color:#16a34a;}
.file-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);gap:8px;}
.file-row:first-child{border-top:none;}
.file-info{font-size:.85rem;}
.file-info .code{font-weight:700;letter-spacing:1px;}
.file-info .name{color:var(--muted);}
.result{margin-top:16px;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);}
.result a{display:inline-block;margin-top:10px;background:var(--accent);color:var(--accent-text);
  padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem;}
.preview{margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg);}
.preview iframe{width:100%;height:420px;border:none;display:block;}
.preview img{width:100%;max-height:420px;object-fit:contain;display:block;background:var(--bg);}
.hint{font-size:.75rem;color:var(--muted);margin-top:20px;text-align:center;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">Consultez un fichier avec un code</div>

  <div class="card">
    <h2>Consulter un fichier</h2>
    <label for="lookupCode">Code reçu</label>
    <input type="text" class="code-input" id="lookupCode" maxlength="8" placeholder="EX: A1B2C3">
    <button id="lookupBtn">Consulter</button>
    <div id="lookupMsg" class="msg"></div>
    <div id="lookupResult" class="result hidden"></div>
  </div>

  <div class="hint" id="adminToggleWrap" style="margin-top:28px;">
    <a href="#" id="adminToggle" style="color:var(--muted);text-decoration:underline;">Administration</a>
  </div>
  <div class="card hidden" id="adminLoginCard">
    <h2>Accès administrateur</h2>
    <label for="adminPass">Mot de passe</label>
    <input type="text" id="adminPass" placeholder="Mot de passe">
    <button id="adminLoginBtn">Valider</button>
    <div id="adminLoginMsg" class="msg"></div>
  </div>

  <div class="card hidden" id="adminCard">
    <h2>Ajouter un fichier (admin)</h2>
    <label for="fileInput">Fichier (texte, PDF, image)</label>
    <input type="file" id="fileInput">
    <label for="descInput">Description (optionnel)</label>
    <input type="text" id="descInput" placeholder="Facture, rapport, photo...">
    <button id="uploadBtn">Générer le code</button>
    <div id="uploadMsg" class="msg"></div>
    <div id="newCodeBox" class="code-box hidden"></div>
  </div>

  <div class="card hidden" id="listCard">
    <h2>Fichiers partagés</h2>
    <div id="fileList"></div>
  </div>
</div>

<script>
let adminPassword = "";

function genQS(params){
  return Object.entries(params).map(([k,v]) => encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
}

function setMsg(el, text, kind){
  el.textContent = text;
  el.className = "msg" + (kind ? " "+kind : "");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("adminToggle").addEventListener("click", (e) => {
  e.preventDefault();
  document.getElementById("adminLoginCard").classList.remove("hidden");
  document.getElementById("adminToggleWrap").classList.add("hidden");
  document.getElementById("adminPass").focus();
});

document.getElementById("adminLoginBtn").addEventListener("click", async () => {
  const msgEl = document.getElementById("adminLoginMsg");
  const pass = document.getElementById("adminPass").value;
  setMsg(msgEl, "Vérification…", "");
  try{
    const res = await fetch("/.netlify/functions/list-files?" + genQS({password: pass}));
    if(res.status === 401){
      setMsg(msgEl, "Mot de passe incorrect.", "err");
      return;
    }
    adminPassword = pass;
    document.getElementById("adminLoginCard").classList.add("hidden");
    document.getElementById("adminCard").classList.remove("hidden");
    document.getElementById("listCard").classList.remove("hidden");
    loadList();
  }catch(e){
    setMsg(msgEl, "Erreur de connexion.", "err");
  }
});

document.getElementById("lookupBtn").addEventListener("click", async () => {
  const msgEl = document.getElementById("lookupMsg");
  const resultEl = document.getElementById("lookupResult");
  resultEl.classList.add("hidden");
  const code = document.getElementById("lookupCode").value.trim().toUpperCase();
  if(!code){ setMsg(msgEl, "Entrez un code.", "err"); return; }
  setMsg(msgEl, "Recherche…", "");
  try{
    const res = await fetch("/.netlify/functions/file-info?" + genQS({code}));
    if(res.status === 404){
      setMsg(msgEl, "Code introuvable. Vérifiez et réessayez.", "err");
      return;
    }
    const d = await res.json();
    setMsg(msgEl, "", "");
    resultEl.classList.remove("hidden");
    const fileUrl = "/.netlify/functions/get-file?" + genQS({code});
    let previewHtml = "";
    const ct = d.contentType || "";
    if(ct === "application/pdf"){
      previewHtml = "<div class='preview'><iframe src='" + fileUrl + "'></iframe></div>";
    } else if(ct.indexOf("image/") === 0){
      previewHtml = "<div class='preview'><img src='" + fileUrl + "' alt='Aperçu'></div>";
    }
    resultEl.innerHTML =
      "<div><strong>" + escapeHtml(d.filename || "Fichier") + "</strong></div>" +
      (d.description ? "<div style='color:var(--muted);font-size:.85rem;margin-top:4px;'>" + escapeHtml(d.description) + "</div>" : "") +
      previewHtml +
      "<a href='" + fileUrl + "' download='" + escapeHtml(d.filename || "fichier") + "'>Télécharger</a>";
  }catch(e){
    setMsg(msgEl, "Erreur lors de la recherche.", "err");
  }
});

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const msgEl = document.getElementById("uploadMsg");
  const codeBox = document.getElementById("newCodeBox");
  codeBox.classList.add("hidden");
  const fileEl = document.getElementById("fileInput");
  const descEl = document.getElementById("descInput");
  const file = fileEl.files[0];
  if(!file){ setMsg(msgEl, "Choisissez un fichier.", "err"); return; }
  setMsg(msgEl, "Envoi en cours…", "");
  try{
    const dataBase64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(",")[1]);
      r.onerror = () => reject(new Error("Lecture du fichier impossible"));
      r.readAsDataURL(file);
    });
    const res = await fetch("/.netlify/functions/add-file", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        filename: file.name,
        contentType: file.type,
        dataBase64,
        description: descEl.value.trim(),
        password: adminPassword
      })
    });
    const data = await res.json();
    if(!res.ok){
      setMsg(msgEl, data.error || "Échec de l'envoi.", "err");
      return;
    }
    setMsg(msgEl, "Fichier ajouté avec succès.", "ok");
    codeBox.classList.remove("hidden");
    codeBox.textContent = data.code;
    fileEl.value = "";
    descEl.value = "";
    loadList();
  }catch(e){
    setMsg(msgEl, "Échec de l'envoi: " + e.message, "err");
  }
});

async function loadList(){
  const listEl = document.getElementById("fileList");
  try{
    const res = await fetch("/.netlify/functions/list-files?" + genQS({password: adminPassword}));
    const data = await res.json();
    const files = data.files || [];
    if(files.length === 0){
      listEl.innerHTML = "<div style='color:var(--muted);font-size:.85rem;'>Aucun fichier pour l'instant.</div>";
      return;
    }
    listEl.innerHTML = files.map(d => {
      return "<div class='file-row'>" +
        "<div class='file-info'><span class='code'>" + escapeHtml(d.code) + "</span><br>" +
        "<span class='name'>" + escapeHtml(d.filename || "") + "</span></div>" +
        "<button class='secondary' data-code='" + escapeHtml(d.code) + "'>Suppr.</button>" +
        "</div>";
    }).join("");
    listEl.querySelectorAll("button[data-code]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const code = btn.getAttribute("data-code");
        try{
          await fetch("/.netlify/functions/delete-file", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({code, password: adminPassword})
          });
          loadList();
        }catch(e){}
      });
    });
  }catch(e){
    listEl.innerHTML = "<div style='color:var(--muted);font-size:.85rem;'>Impossible de charger la liste.</div>";
  }
}
</script>
</body>
</html>
